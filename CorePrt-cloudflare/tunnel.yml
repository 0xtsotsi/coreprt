# tunnel.yml — CorePrt cloudflared config
#
# One-time setup:
#   cloudflared tunnel login                    # authorise against Cloudflare dashboard
#   cloudflared tunnel create coreprt
#     # writes ~/.cloudflared/<TUNNEL_ID>.json and prints <TUNNEL_ID>
#   # Replace the TUNNEL_ID below, then:
#   cloudflared tunnel route dns coreprt coreprt.webrnds.com
#   cloudflared tunnel run coreprt              # foreground smoke-test
#
# Service launch (auto-start after boot):
#   brew services start cloudflared
#   # the daemon reads /opt/homebrew/etc/cloudflared/config.yml — symlink to this file.
tunnel: coreprt
credentials-file: /Users/gogetta/.cloudflared/c40f4029-2ba3-4182-b1c4-b9cab95c305e.json
# the credentials-file above points to the existing tunnel
# c40f4029-2ba3-4182-b1c4-b9cab95c305e (created previously and
# bound to coreprt.webrnds.com). The file is host-local (~/.cloudflared/);
# do not commit it. To bind a fresh tunnel on a new host, run
# `cloudflared tunnel create coreprt`, copy the new credentials JSON
# to this path, and then `cloudflared tunnel route dns coreprt coreprt.webrnds.com`.
protocol: http2
# forced http2 because WARP's split-tunnel blocks the QUIC handshake on
# UDP/7844 even though UDP/7844 reachability succeeds for bare packets.
# precheck on 2026-07-30 confirmed UDP/7844 reachability PASS across the
# full edge IP set, but every QUIC handshake times out at 11s
# ("handshake did not complete in time") with `protocol: auto`.
# Bare-UDP works because WARP's UDP filter is path-aware; the QUIC
# ClientHello is filtered. The split-tunnel bypass is partial: it
# routes traffic around WARP's DNS resolver and IPv6 prefix, but the
# outgoing UDP socket still hits WARP's egress firewall on the QUIC
# handshake bytes.
#
# TODO: explore `cloudflared tunnel --edge-ip-version 4` to force IPv4
# only (which may not be on WARP's filter list at all), or upgrade
# cloudflared to >= 2026.7.3 which has a known handshake resilience
# improvement (the current binary is 2026.7.1).

ingress:
  # WebSocket path also goes through HTTPS — cloudflared re-routes by Host.
  - hostname: coreprt.webrnds.com
    service: http://127.0.0.1:3300
    originRequest:
      connectTimeout: 10s
      noTLSVerify: false
      keepAliveConnections: 4
      httpHostHeader: coreprt.webrnds.com
  # catch-all: 404 from a tunnel, not the relay
  - service: http_status:404
